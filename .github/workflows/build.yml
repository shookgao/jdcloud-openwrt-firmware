# 京东云三台路由器的 ImmortalWrt-NSS 云编译
# 源码: VIKINGYFY/immortalwrt — NSS 全加速平台层 (内核 6.18, 含 qca-nss-drv/ecm
#       与无线 NSS 卸载), 三台设备原生支持, f2fs 持久化层默认自带
# 策略: 锁定源码 commit (不自动跟随上游)。升级 = 修改 UPSTREAM_COMMIT 后手动触发,
#       验证通过即为新 known-good; 旧 commit 号可随时回退。
# 注入: 仅叠加我们独有三项 — MAC 原厂化 / argon 主题与弹窗配色 / apk 源修正
#       (见 Scripts/inject.sh), 其余全部使用上游原味代码。

name: Build

on:
  workflow_dispatch:

env:
  UPSTREAM_REPO: "https://github.com/VIKINGYFY/immortalwrt"
  # 锁定的 known-good 源码版本:
  # 对应其发布版 IPQ60XX-WIFI-YES-VIKINGYFY-main-26.09.19-09.07.56,
  # 完整 CI 构建 + 社区验证。升级前先 diff 上游新提交, 只挑 NSS/无线相关的动。
  UPSTREAM_COMMIT: "87b57bffcc954cfa3de9516eaee8524289f99d18"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: 编译 ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [jdcloud_re-cs-02, jdcloud_re-ss-01, link_nn6000-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # ccache 缓存目录固定在工作区, 供 actions/cache 持久化
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        run: |
          # 删除 runner 预装但本流程用不到的大组件, 全量编译约需 30~35GB
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "==> 释放后剩余空间:"
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
            xmlto xxd zlib1g-dev zstd

      - name: 拉取上游源码 (锁定版本)
        run: |
          git init openwrt
          cd openwrt
          git remote add origin "$UPSTREAM_REPO"
          git fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git checkout FETCH_HEAD
          echo "==> 源码版本: ${UPSTREAM_COMMIT:0:7} ($(git log -1 --format=%ci))"

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          # LuCI 等包在 feeds 里, 不拉取则 default-settings 的 luci 依赖装不上
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 恢复源码包缓存
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          # 换源码基线时靠 restore-keys 兜底取最近一份
          key: dl-nss-${{ env.UPSTREAM_COMMIT }}
          restore-keys: dl-nss-

      - name: 恢复编译缓存
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          # 三台设备共用一份 (内核与绝大部分软件包相同)
          key: ccache-nss-${{ env.UPSTREAM_COMMIT }}
          restore-keys: ccache-nss-

      - name: 恢复工具链缓存
        uses: actions/cache@v6
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
          # 上游更换 gcc 大版本时目录名变化, 缓存自然失配并全量重建, 无需干预
          key: toolchain-nss-${{ env.UPSTREAM_COMMIT }}
          restore-keys: toolchain-nss-

      - name: 刷新工具链时间戳
        run: |
          # git clone 出的源码 mtime 全部是"刚刚", 会让 make 误判"源码比缓存的
          # 工具链新"而照常重编; 将缓存内容时间戳统一刷新到当前时刻,
          # 使编译 stamp 新于所有源文件, make 才会真正跳过工具链编译。
          # host/bin 下有硬链接到系统工具的只读文件, 用 sudo 才能全部刷到
          shopt -s nullglob
          for d in openwrt/staging_dir/toolchain-* openwrt/staging_dir/host openwrt/staging_dir/hostpkg; do
            [ -d "$d" ] && sudo find "$d" -exec touch {} +
          done
          ls -d openwrt/staging_dir/* 2>/dev/null || echo "==> 未命中工具链缓存 (首次运行将全量编译并保存)"

      - name: 注入自有修正
        run: |
          chmod +x Scripts/inject.sh
          ./Scripts/inject.sh "$PWD/openwrt"

      - name: 生成配置
        run: |
          cd openwrt
          # 目标平台与多机型开关照抄, 设备只保留本 job 对应的一台
          grep -E '^CONFIG_TARGET_(qualcommax|MULTI_PROFILE)' ../Config/DEVICES.txt > .config
          grep "DEVICE_${{ matrix.device }}=y" ../Config/DEVICES.txt >> .config
          cat ../Config/COMMON.txt >> .config
          make defconfig
          grep -E "CONFIG_TARGET_DEVICE" .config || { echo "设备配置未生效"; exit 1; }
          grep -q "DEVICE_${{ matrix.device }}=y" .config || { echo "本机设备配置未生效"; exit 1; }

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          make download -j1 V=s   # 补齐个别下载失败的文件

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: 无线板卡与 NSS 组件自检
        run: |
          # BDF 缺失则 ath11k 不注册网卡; NSS 缺失则失去硬件加速,
          # 两者任一缺失都必须在编译期拦下
          cd openwrt
          P=bin/targets/qualcommax/ipq60xx
          # 本机对应的 BDF 包名 (link_nn6000-v2 → ipq-wifi-link_nn6000, v1/v2 共用)
          case "${{ matrix.device }}" in
            link_nn6000-v2) BDF="ipq-wifi-link_nn6000" ;;
            *)              BDF="ipq-wifi-${{ matrix.device }}" ;;
          esac
          if ls $P/*.manifest >/dev/null 2>&1; then
            grep -q "$BDF" $P/*.manifest \
              || { echo "!! 缺少无线板卡数据包 $BDF, 无线将不可用"; exit 1; }
            grep -q "kmod-qca-nss-ecm" $P/*.manifest \
              || { echo "!! 缺少 NSS 加速组件 kmod-qca-nss-ecm"; exit 1; }
            echo "==> 自检通过 (manifest): $BDF + kmod-qca-nss-ecm"
          else
            DB=staging_dir/target-*/root-qualcommax/lib/apk/db/installed
            grep -q "$BDF" $DB || { echo "!! 缺少无线板卡数据包, 无线将不可用"; exit 1; }
            grep -q "kmod-qca-nss-ecm" $DB || { echo "!! 缺少 NSS 加速组件"; exit 1; }
            echo "==> 自检通过 (apk db): $BDF + kmod-qca-nss-ecm"
          fi

      - name: 整理产物
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp -f *sysupgrade* *factory* "$GITHUB_WORKSPACE/output/"
          cd "$GITHUB_WORKSPACE/output"
          ls -la

      - name: 上传编译产物
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.device }}
          path: output/*

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 合并三台设备产物
        uses: actions/download-artifact@v8
        with:
          path: output
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd output
          # 三个 job 的固件在此汇合, 统一生成全量 sha256sums
          [ "$(ls ./*.bin | wc -l)" -eq 6 ] || { echo "!! 固件数量异常, 应为 6 个"; ls -la; exit 1; }
          sha256sum ./*.bin > sha256sums
          ls -la

      - name: 发布 Release
        env:
          UP_SHA: ${{ env.UPSTREAM_COMMIT }}
        run: |
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          TAG="auto-${DATE}-${UP_SHA:0:7}"
          NOTES="$(cat <<'EOF'
          自动编译, 基于 VIKINGYFY/immortalwrt NSS 平台 (内核 6.18, NSS 全加速)。

          刷机: eMMC 设备用 sysupgrade 包在 LuCI 或 sysupgrade 命令升级;
          从原厂系统/U-Boot 刷入用 factory 包 (第三方 U-Boot, 教程见恩山论坛)。
          校验: 下载后请核对 sha256sums。
          EOF
          )"
          NOTES="$NOTES
          设备: 京东云雅典娜 RE-CS-02 / 京东云 RE-SS-01 / 连我 NN6000 v2
          源码锁定: ${UP_SHA}"
          # 同日同源重编时旧 Release 已存在: 先删旧再建; 仍失败则向已有
          # Release 覆盖上传 (--clobber), 保证任何情况下发布成功
          gh release delete "$TAG" --yes --cleanup-asset || echo "(无旧 Release 或删除跳过)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || echo "(tag 不存在或已删除)"
          if gh release create "$TAG" output/* \
              --title "ImmortalWrt-NSS (${UP_SHA:0:7}, $DATE)" \
              --notes "$NOTES" \
              --latest; then
            echo "==> Release 创建成功"
          else
            echo "==> create 失败, 改为向已有 Release 覆盖上传"
            gh release upload "$TAG" output/* --clobber
            gh release edit "$TAG" --latest \
              --title "ImmortalWrt-NSS (${UP_SHA:0:7}, $DATE)" --notes "$NOTES"
          fi
