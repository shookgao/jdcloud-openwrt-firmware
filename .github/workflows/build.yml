# 京东云三台路由器的 ImmortalWrt 云编译
# 上游: immortalwrt 最新正式版 release (全自动检测, 跨大版本自动跟随)
# 特点: 每天检查上游, 出新正式版才编译; 无第三方插件来源

name: Build

on:
  workflow_dispatch:
    inputs:
      force:
        description: "跳过上游检查, 强制编译"
        type: boolean
        default: false
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间 06:00, 每天检查

env:
  UPSTREAM_REPO: "https://github.com/immortalwrt/immortalwrt"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    name: 检查上游更新
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.diff.outputs.should_build }}
      sha: ${{ steps.diff.outputs.sha }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 检测上游最新正式版
        id: diff
        run: |
          UP_TAG="$(git ls-remote --refs "$UPSTREAM_REPO" 'refs/tags/v*' \
            | sed 's|.*refs/tags/||' | grep -v -- '-rc' | sort -rV | head -n1)"
          if [ -z "$UP_TAG" ]; then echo "无法获取上游 release 列表"; exit 1; fi
          UP_SHA="$(git ls-remote --refs "$UPSTREAM_REPO" "refs/tags/$UP_TAG" | cut -f1)"
          if [ -z "$UP_SHA" ]; then echo "无法获取 $UP_TAG 的提交号"; exit 1; fi
          LAST="$(cat .last-build-sha 2>/dev/null || echo none)"
          echo "上游最新: $UP_TAG ($UP_SHA)"
          echo "上次编译: $LAST"
          echo "tag=$UP_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          if [ "$UP_SHA" != "$LAST" ]; then
            echo "有新正式版, 需要编译"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "上游无变化, 跳过编译"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 编译三台设备固件
    needs: check
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) || needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ccache 缓存目录固定在工作区, 供 actions/cache 持久化
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        run: |
          # 删除 runner 预装但本流程用不到的大组件, 全量编译约需 30~35GB
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "==> 释放后剩余空间:"
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget \
            xmlto xxd zlib1g-dev zstd

      - name: 拉取上游源码
        env:
          UP_TAG: ${{ needs.check.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$UP_TAG" "$UPSTREAM_REPO" openwrt
          cd openwrt
          echo "上游版本: $UP_TAG ($(git rev-parse --short HEAD)) $(git log -1 --format=%cd --date=short)"

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          # LuCI 等包在 feeds 里, 不拉取则 default-settings 的 luci 依赖装不上
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 恢复源码包缓存
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          # 跟随上游版本滚动: 新版本存新 key, restore-keys 兜底取最近一份
          key: dl-${{ needs.check.outputs.tag }}
          restore-keys: dl-

      - name: 恢复编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # 每次编译按上游 SHA 存新缓存, restore-keys 取最近一份继续累积
          key: ccache-${{ needs.check.outputs.sha }}
          restore-keys: ccache-

      - name: 恢复工具链缓存
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
          # 上游更换 gcc 大版本时目录名变化, 缓存自然失配并全量重建, 无需干预
          key: toolchain-${{ needs.check.outputs.tag }}
          restore-keys: toolchain-

      - name: 刷新工具链时间戳
        run: |
          # git clone 出的源码 mtime 全部是"刚刚", 会让 make 误判"源码比缓存的
          # 工具链新"而照常重编; 将缓存内容时间戳统一刷新到当前时刻,
          # 使编译 stamp 新于所有源文件, make 才会真正跳过工具链编译。
          # host/bin 下有硬链接到系统工具的只读文件, 用 sudo 才能全部刷到
          shopt -s nullglob
          for d in openwrt/staging_dir/toolchain-* openwrt/staging_dir/host openwrt/staging_dir/hostpkg; do
            [ -d "$d" ] && sudo find "$d" -exec touch {} +
          done
          ls -d openwrt/staging_dir/* 2>/dev/null || echo "==> 未命中工具链缓存 (首次运行将全量编译并保存)"

      - name: 注入三台设备支持
        run: |
          chmod +x Scripts/inject.sh
          ./Scripts/inject.sh "$PWD/openwrt"

      - name: 生成配置
        run: |
          cd openwrt
          cat ../Config/DEVICES.txt ../Config/COMMON.txt > .config
          make defconfig
          grep -E "CONFIG_TARGET_DEVICE" .config || { echo "设备配置未生效"; exit 1; }

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          make download -j1 V=s   # 补齐个别下载失败的文件

      - name: 编译
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: 整理产物
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp -f *sysupgrade* *factory* sha256sums config.build 2>/dev/null \
            "$GITHUB_WORKSPACE/output/" || true
          cd "$GITHUB_WORKSPACE/output"
          ls -la

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ needs.check.outputs.sha }}
          UP_TAG: ${{ needs.check.outputs.tag }}
        run: |
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          TAG="auto-${DATE}-${UP_TAG}"
          NOTES="$(cat <<'EOF'
          自动编译, 基于 immortalwrt 25.12 系列正式版。

          设备: 京东云雅典娜 RE-CS-02 / 京东云 RE-SS-01 / 连我 NN6000 v2

          刷机: eMMC 设备用 sysupgrade 包在 LuCI 或 sysupgrade 命令升级;
          从原厂系统刷入请先刷对应机型的第三方 U-Boot (教程见恩山论坛)。
          校验: 下载后请核对 sha256sums。
          EOF
          )"
          NOTES="$NOTES
          上游版本: ${UP_TAG}"
          # 同日同上游重编时旧 Release 已存在: 先删旧再建; 仍失败则向已有
          # Release 覆盖上传 (--clobber), 保证任何情况下发布成功
          gh release delete "$TAG" --yes --cleanup-asset || echo "(无旧 Release 或删除跳过)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || echo "(tag 不存在或已删除)"
          if gh release create "$TAG" output/* \
              --title "ImmortalWrt $UP_TAG ($DATE)" \
              --notes "$NOTES" \
              --latest; then
            echo "==> Release 创建成功"
          else
            echo "==> create 失败, 改为向已有 Release 覆盖上传"
            gh release upload "$TAG" output/* --clobber
            gh release edit "$TAG" --latest \
              --title "ImmortalWrt $UP_TAG ($DATE)" --notes "$NOTES"
          fi

      - name: 记录本次上游版本
        env:
          UP_SHA: ${{ needs.check.outputs.sha }}
          UP_TAG: ${{ needs.check.outputs.tag }}
        run: |
          echo "$UP_SHA" > .last-build-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build-sha
          # 同一上游版本重编时内容无变化, git commit 会报 nothing to commit, 直接跳过
          if git diff --cached --quiet; then
            echo "上游版本未变化, 无需记录"
          else
            git commit -m "build: 上游 ${UP_TAG}"
            # 防止编译期间有人推送过新提交导致 non-fast-forward; autostash 收纳零星工作区改动
            git -c rebase.autostash=true pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
